<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypress 16 + http2 + blockHosts bug</title>
</head>
<body>
    <h1>Cypress 16 + http2 + blockHosts bug</h1>
    <p id="change-me">✅ <code>blockHosts</code> works!</p>
    <p id="protocol">Protocol: <mark><code>detecting...</code></mark></p>
    <script>
      // Protocol negotiated on the browser -> (Cypress proxy ->) server hop.
      // "h2"/"h3" = HTTP/2+, "http/1.1" = HTTP/1.1 (e.g. Cypress forceHttp1).
      var nav = performance.getEntriesByType("navigation")[0];
      document.querySelector("#protocol code").textContent =
        (nav && nav.nextHopProtocol) || "unknown";
    </script>
    <script src="https://cypress16-http2-blockhosts-b-git-f6c15d-koen-verheyens-projects.vercel.app/blocked-script.js"></script>
</body>
</html>
